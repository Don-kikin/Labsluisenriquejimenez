<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interacción con HTML, CSS y JavaScript</title>

    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <!-- Tarea 1: Primer encabezado con ID red -->
        <h1 id="red">Hola Mundo</h1>

        <!-- Tarea 1: Imagen -->
        <img 
            src="Pictures/X - Xbox.jpg" 
            alt="Control de Xbox"
            class="imagen-xbox"
        >

        <!-- Tarea 1: Cuatro encabezados adicionales -->
        <section class="encabezados">

            <h2 class="blue">Hola Mundo</h2>

            <h2 class="blue">Hola Mundo</h2>

            <h2>Hola Mundo</h2>

            <h2>Hola Mundo</h2>

        </section>

        <!-- Tarea 3: Encabezado interactivo -->
        <h2 id="encabezado-clic">
            Haz clic aquí para cambiar a marrón
        </h2>

    </main>

    <!-- Tarea 3: JavaScript -->
    <script src="script.js"></script>

</body>

</html>
